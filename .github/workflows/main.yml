name: Teste automate asistent financiar

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  teste-automate:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Pregateste Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependintele proiectului
        run: python -m pip install -r requirements.txt

      - name: Instaleaza instrumentele de test pentru browser
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Ruleaza testele automate
        run: python -m unittest discover -s tests -v

