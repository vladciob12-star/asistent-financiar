name: Teste automate asistent financiar

on:
  workflow_dispatch:

jobs:
  teste-automate:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Pregateste Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependintele proiectului
        run: python -m pip install -r requirements.txt

      - name: Ruleaza testele automate
        run: python -m unittest discover -s tests -v
